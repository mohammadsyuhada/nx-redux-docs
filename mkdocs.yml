site_name: NX Redux
site_description: User documentation for NX Redux — custom firmware for TrimUI retro handhelds
site_url: https://nxredux.com/
repo_url: https://github.com/mohammadsyuhada/nx-redux
repo_name: mohammadsyuhada/nx-redux
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: slate
    primary: black
    accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/sidebar-sections.js

plugins:
  - search
  - redirects:
      redirect_maps:
        reference/faq.md: reference/faq/handheld.md
        reference/release-notes.md: reference/release-notes/handheld.md
        handheld/index.md: handheld/getting-started.md
        mobile/index.md: mobile/getting-started.md
        getting-started.md: handheld/getting-started.md
        guide/main-menu.md: handheld/guide/main-menu.md
        guide/game-switcher.md: handheld/guide/game-switcher.md
        guide/context-menu.md: handheld/guide/context-menu.md
        guide/five-game-menu.md: handheld/guide/five-game-menu.md
        guide/playing-games.md: handheld/guide/playing-games.md
        guide/in-game-options.md: handheld/guide/in-game-options.md
        guide/shortcuts.md: handheld/guide/shortcuts.md
        guide/keyboard.md: handheld/guide/keyboard.md
        guide/button-layout.md: handheld/guide/button-layout.md
        guide/emulator-options.md: handheld/guide/emulator-options.md
        guide/osd.md: handheld/guide/osd.md
        guide/simple-mode.md: handheld/guide/simple-mode.md
        guide/file-access.md: handheld/guide/file-access.md
        apps/tools.md: handheld/apps/tools.md
        apps/artwork-manager.md: handheld/apps/artwork-manager.md
        apps/cheats.md: handheld/apps/cheats.md
        apps/device-sync.md: handheld/apps/device-sync.md
        apps/emulator-settings.md: handheld/apps/emulator-settings.md
        apps/files.md: handheld/apps/files.md
        apps/game-tracker.md: handheld/apps/game-tracker.md
        apps/image-viewer.md: handheld/apps/image-viewer.md
        apps/media-player.md: handheld/apps/media-player.md
        apps/music-player.md: handheld/apps/music-player.md
        apps/portmaster.md: handheld/apps/portmaster.md
        apps/retroachievements.md: handheld/apps/retroachievements.md
        apps/xtras.md: handheld/apps/xtras.md
        emulators/index.md: handheld/emulators/index.md
        emulators/cores.md: handheld/emulators/cores.md
        emulators/rom-formats.md: handheld/emulators/rom-formats.md
        emulators/arcade.md: handheld/emulators/arcade.md
        emulators/nintendo-64.md: handheld/emulators/nintendo-64.md
        emulators/dreamcast.md: handheld/emulators/dreamcast.md
        emulators/psp.md: handheld/emulators/psp.md
        emulators/nintendo-ds.md: handheld/emulators/nintendo-ds.md
        emulators/additional.md: handheld/emulators/additional.md
        netplay.md: handheld/netplay.md
        settings/index.md: handheld/settings/index.md
        settings/display.md: handheld/settings/display.md
        settings/appearance.md: handheld/settings/appearance.md
        settings/notifications.md: handheld/settings/notifications.md
        settings/led-control.md: handheld/settings/led-control.md
        settings/network.md: handheld/settings/network.md
        settings/bluetooth.md: handheld/settings/bluetooth.md
        settings/audio.md: handheld/settings/audio.md
        settings/fn-switch.md: handheld/settings/fn-switch.md
        settings/fn-keys.md: handheld/settings/fn-keys.md
        settings/simple-mode.md: handheld/settings/simple-mode.md
        settings/system.md: handheld/settings/system.md
        settings/developer.md: handheld/settings/developer.md
        settings/input-tester.md: handheld/settings/input-tester.md
        settings/about.md: handheld/settings/about.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: [docs/_shared]
      check_paths: true
  - toc:
      permalink: true

not_in_nav: |
  /index.md

exclude_docs: |
  _shared/

